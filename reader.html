<!DOCTYPE html>
<html lang="en">
<head>
<title>Reader — The Law of Attraction | Grow for You</title>
<link rel="icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="assets/images/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

/* ===== PURE BLACK BACKGROUND ===== */
body{
  background:#000;
  overflow:hidden;
  color:#e5e7eb;
}

/* REMOVE MOBILE BLUE TAP / TOUCH EFFECT */
*{
  -webkit-tap-highlight-color:transparent;
}

button,
a,
.page{
  outline:none;
}

.page:active{
  background:transparent;
}

/* ===== THEME-MATCHED LOGIN GATE ===== */
#memberGate {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000; /* Pure black to blend with body */
  z-index: 9999;
}

.gate-card {
  width: 90%;
  max-width: 450px;
  padding: 50px 30px;
  text-align: center;
  
  /* Matches your .card-style from account.html */
  background: rgba(15, 23, 42, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 28px;
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
}

.gate-card h1 {
  font-size: 2rem;
  margin-bottom: 15px;
  color: #fff;
  /* Matches the h2 styling from your site */
  border-left: 4px solid #22d3ee; 
  padding-left: 15px;
  display: inline-block;
  text-align: left;
}

.gate-card p {
  opacity: 0.7;
  margin-bottom: 30px;
  line-height: 1.6;
  font-size: 0.95rem;
}

.btn-main {
  display: inline-block;
  width: 100%;
  padding: 16px;
  border-radius: 15px;
  /* Matches your exact site gradient: Primary, Secondary, Accent */
  background: linear-gradient(135deg, #6366f1, #22d3ee, #22c55e);
  color: #fff;
  text-decoration: none;
  font-weight: 700;
  transition: 0.3s ease;
  cursor: pointer;
  border: none;
  font-size: 1rem;
}

.btn-main:hover {
  transform: translateY(-3px);
  filter: brightness(1.1);
  box-shadow: 0 10px 20px rgba(34, 211, 238, 0.2);
}

/* ===== READER STAGE ===== */
.reader{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  perspective:2600px;
}

/* ===== BOOK ===== */
.book{
  width:min(92vw,380px);
  height:min(92vh,560px);
  position:relative;
  transform-style:preserve-3d;
}

/* ===== PAGE ===== */
.page{
  position:absolute;
  width:100%;
  height:100%;
  transform-origin:left;
  transform-style:preserve-3d;
  transition:transform 1.15s cubic-bezier(.22,.61,.36,1);
  cursor:pointer;
}

/* ===== PAGE IMAGE ===== */
.page img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:10px;
  background:#000;
  backface-visibility:hidden;
}

/* ===== BACK SIDE ===== */
.page::after{
  content:"";
  position:absolute;
  inset:0;
  background:#000;
  transform:rotateY(180deg);
  backface-visibility:hidden;
}

/* ===== FLIPPED ===== */
.page.flipped{
  transform:rotateY(-180deg);
}

/* ===== PAGE COUNTER ===== */
.counter{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.9);
  padding:10px 22px;
  border-radius:999px;
  font-size:.9rem;
  display:none;
}
</style>
</head>

<body>

<!-- ===== MEMBER LOGIN GATE ===== -->
<div id="memberGate">
  <div class="gate-card">
    <h1>Welcome </h1>
    <p>Sign in to access your personal library and exclusive member content.</p>
    <button class="btn-main" id="loginBtn">Log in / Join Now</button>
  </div>
</div>

<!-- ===== READER ===== -->
<div class="reader" id="reader">
  <div class="book" id="book"></div>
</div>

<div class="counter" id="counter">1 / 15</div>

<script>
/* ===== LOGIN SYSTEM ===== */
const gate=document.getElementById("memberGate");
const reader=document.getElementById("reader");
const counter=document.getElementById("counter");

function openReader(){
  gate.style.display="none";
  reader.style.display="flex";
  counter.style.display="block";
}

/* Netlify login */
if(window.netlifyIdentity){
  netlifyIdentity.on("login",()=>{
    openReader();
    netlifyIdentity.close();
  });
  netlifyIdentity.init();
}

document.getElementById("loginBtn").onclick=()=>{
  netlifyIdentity.open();
};

/* ===== PAGES ===== */
const pages=[
"assets/reader/images/subliminal-page1.jpg",
"assets/reader/images/subliminal-page2.jpg",
"assets/reader/images/subliminal-page3.jpg",
"assets/reader/images/subliminal-page4.jpg"
];

const book=document.getElementById("book");
let current=0;

/* ===== CREATE PAGES ===== */
pages.forEach((src,i)=>{
  const page=document.createElement("div");
  page.className="page";
  page.style.zIndex=pages.length-i;

  const img=new Image();
  img.src=src;
  page.appendChild(img);

  let startX=0;

  page.ontouchstart=e=>{
    startX=e.touches[0].clientX;
  };

  page.ontouchend=e=>{
  const diff=e.changedTouches[0].clientX-startX;

  /* Swipe Left → Next Page */
  if(diff < -50 && i === current && current < pages.length){
    next();
  }

  /* Swipe Right → Previous Page */
  if(diff > 50 && i === current-1 && current > 0){
    prev();
  }
};

  page.onclick=()=>{
    if(i===current) next();
    else if(i===current-1) prev();
  };

  book.appendChild(page);
});

/* ===== NAVIGATION ===== */
function next(){
  const pg=document.querySelectorAll(".page");
  if(current>=pages.length) return;

  pg[current].classList.add("flipped");
  current++;
  update();
}

function prev(){
  const pg=document.querySelectorAll(".page");
  if(current<=0) return;

  current--;
  pg[current].classList.remove("flipped");
  update();
}

function update(){
  counter.textContent=`${Math.max(current,1)} / ${pages.length}`;
}

/* Disable save */
document.oncontextmenu=e=>e.preventDefault();
</script>

</body>
</html>
