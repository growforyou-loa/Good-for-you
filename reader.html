<!DOCTYPE html>
<html lang="en">
<head>
<title>Reader — Good for You</title>
<link rel="icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="assets/images/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Poppins', sans-serif;
}

/* ── Pure black stage — perspective only affects #book ── */
#stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  perspective: 1800px;
  perspective-origin: 50% 50%;
}

/* ── Book: 3D container — ONLY this and its children are 3D ── */
#book {
  position: relative;
  transform-style: preserve-3d;
}

/* ── Page ── */
.page {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 0.78s cubic-bezier(0.77, 0, 0.175, 1);
  border-radius: 3px 10px 10px 3px;
  filter:
    drop-shadow(0 6px 32px rgba(0,0,0,0.98))
    drop-shadow(0 2px 8px rgba(0,0,0,0.9));
}

/* ── Front face ── */
.page-front {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: #090909;
}
.page-front img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
  -webkit-user-drag: none;
  border-radius: inherit;
}

/* Spine crease — image only */
.page-front::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 20px;
  background: linear-gradient(to right,
    rgba(0,0,0,0.7) 0%,
    rgba(0,0,0,0.12) 65%,
    transparent 100%
  );
  z-index: 1;
  pointer-events: none;
  border-radius: 3px 0 0 3px;
}

/* Page shimmer during flip */
.page-front::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    108deg,
    transparent 38%,
    rgba(255,255,255,0.06) 52%,
    transparent 66%
  );
  opacity: 0;
  transition: opacity 0.18s;
  pointer-events: none;
  border-radius: inherit;
}
.page.flipping .page-front::after { opacity: 1; }

/* ── Back face ── */
.page-back {
  position: absolute;
  inset: 0;
  border-radius: 10px 3px 3px 10px;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: rotateY(180deg);
  background: #060606;
}
.page-back img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
  -webkit-user-drag: none;
  transform: scaleX(-1);
  opacity: 0.06;
  filter: blur(4px);
}

/* ── Flipped state ── */
.page.flipped {
  transform: rotateY(-180deg);
}

/* ── Page counter ── */
#counter {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  font-size: 0.65rem;
  font-weight: 300;
  letter-spacing: 0.22em;
  color: rgba(255,255,255,0.22);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s;
  white-space: nowrap;
}
#counter.show { opacity: 1; }

/* ── Fullscreen button ── */
#fsBtn {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 50;
  width: 34px; height: 34px;
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.2;
  transition: opacity 0.25s;
  padding: 0;
}
#fsBtn:hover { opacity: 0.65; }

/* ── Back link ── */
#backLink {
  position: fixed;
  top: 20px;
  left: 18px;
  z-index: 50;
  text-decoration: none;
  color: rgba(255,255,255,0.2);
  font-size: 0.65rem;
  font-weight: 300;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  gap: 5px;
}
#backLink:hover { color: rgba(255,255,255,0.6); }

/* ── Loader ── */
#loader {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s;
}
#loader.out { opacity: 0; pointer-events: none; }
.ring {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.07);
  border-top-color: rgba(255,255,255,0.45);
  animation: spin 0.85s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Mobile ── */
@media (max-width: 480px) {
  #fsBtn   { top: 14px; right: 14px; }
  #backLink{ top: 16px; left: 14px;  }
  #counter { bottom: 16px; }
}
</style>
</head>

<body>

<div id="loader"><div class="ring"></div></div>

<a href="/ebooks" id="backLink">
  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"/>
  </svg>
  Library
</a>

<button id="fsBtn" title="Fullscreen">
  <svg id="fsExpand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
    <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
  </svg>
  <svg id="fsShrink" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
    <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/>
    <line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>
  </svg>
</button>

<div id="stage">
  <div id="book"></div>
</div>

<div id="counter"></div>

<script>
// ── PAGES — edit this array ────────────────────────────────────
const PAGES = [
  "assets/reader/images/subliminal-page1.jpg",
  "assets/reader/images/subliminal-page2.jpg",
  "assets/reader/images/subliminal-page3.jpg",
  "assets/reader/images/subliminal-page4.jpg"
];

let current   = 0;
let animating = false;

const book    = document.getElementById("book");
const counter = document.getElementById("counter");
const loader  = document.getElementById("loader");
const stage   = document.getElementById("stage");

// ── Size ──────────────────────────────────────────────────────
function size() {
  const w = Math.min(Math.round(window.innerWidth  * 0.76), 400);
  const h = Math.min(Math.round(window.innerHeight * 0.83), 580);
  book.style.width  = w + "px";
  book.style.height = h + "px";
}
size();
window.addEventListener("resize", size);

// ── Build pages ───────────────────────────────────────────────
let loaded = 0;

PAGES.forEach((src, i) => {
  const page = document.createElement("div");
  page.className = "page";
  page.style.zIndex = PAGES.length - i;

  // Front
  const front = document.createElement("div");
  front.className = "page-front";
  const img = document.createElement("img");
  img.src = src;
  img.alt = "";
  img.draggable = false;
  img.onload = img.onerror = () => { if (++loaded >= PAGES.length) reveal(); };
  front.appendChild(img);

  // Back (ghost of previous page like a real book)
  const back = document.createElement("div");
  back.className = "page-back";
  if (i > 0) {
    const b = document.createElement("img");
    b.src = PAGES[i - 1];
    b.draggable = false;
    back.appendChild(b);
  }

  page.appendChild(front);
  page.appendChild(back);
  book.appendChild(page);
});

if (!PAGES.length) reveal();

function reveal() {
  loader.classList.add("out");
  counter.classList.add("show");
  tick();
}

// ── Navigation ────────────────────────────────────────────────
function next() {
  if (animating || current >= PAGES.length) return;
  animating = true;
  const pg = book.querySelectorAll(".page")[current];
  pg.classList.add("flipping");
  requestAnimationFrame(() => {
    pg.classList.add("flipped");
    current++;
    tick();
    setTimeout(() => { pg.classList.remove("flipping"); animating = false; }, 820);
  });
}

function prev() {
  if (animating || current <= 0) return;
  animating = true;
  current--;
  const pg = book.querySelectorAll(".page")[current];
  pg.classList.add("flipping");
  requestAnimationFrame(() => {
    pg.classList.remove("flipped");
    tick();
    setTimeout(() => { pg.classList.remove("flipping"); animating = false; }, 820);
  });
}

function tick() {
  counter.textContent = Math.min(current + 1, PAGES.length) + "  /  " + PAGES.length;
}

// ── Click zones ───────────────────────────────────────────────
stage.addEventListener("click", e => {
  if (e.target.closest("#fsBtn") || e.target.closest("#backLink")) return;
  e.clientX > window.innerWidth / 2 ? next() : prev();
});

// ── Keyboard ─────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (["ArrowRight","ArrowDown"," "].includes(e.key)) { e.preventDefault(); next(); }
  if (["ArrowLeft","ArrowUp"].includes(e.key))         { e.preventDefault(); prev(); }
  if ((e.ctrlKey||e.metaKey) && "spua".includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key === "F12" || e.key === "PrintScreen") e.preventDefault();
});

// ── Swipe ─────────────────────────────────────────────────────
let tx = 0;
document.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend",   e => {
  const d = e.changedTouches[0].clientX - tx;
  if (Math.abs(d) > 40) d < 0 ? next() : prev();
}, { passive: true });

// ── Fullscreen ────────────────────────────────────────────────
document.getElementById("fsBtn").addEventListener("click", () => {
  document.fullscreenElement
    ? document.exitFullscreen().catch(()=>{})
    : document.documentElement.requestFullscreen().catch(()=>{});
});
document.addEventListener("fullscreenchange", () => {
  const fs = !!document.fullscreenElement;
  document.getElementById("fsExpand").style.display = fs ? "none"  : "block";
  document.getElementById("fsShrink").style.display = fs ? "block" : "none";
});

// ── Protection ───────────────────────────────────────────────
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart",   e => e.preventDefault());
document.addEventListener("copy",        e => e.preventDefault());

// Blur on tab switch (defeats screenshot capture)
document.addEventListener("visibilitychange", () => {
  book.style.transition = "filter 0.08s";
  if (document.hidden) {
    book.style.filter = "blur(24px) brightness(0.1)";
  } else {
    setTimeout(() => { book.style.filter = ""; }, 220);
  }
});
</script>

</body>
</html>
